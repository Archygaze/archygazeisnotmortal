[project]
name = "archygazeisnotmortal"
version = "0.1.0"
description = "AI Discord text bot that represents you with a customizable persona, channel auto-replies, persistent memory, and free-tier AI provider support."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "discord-py>=2.7.1",
    "google-genai>=3.1.0",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
archygazeisnotmortal = "archygazeisnotmortal.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
